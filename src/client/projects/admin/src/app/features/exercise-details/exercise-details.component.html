<div class="flex flex-col md:flex-row gap-4 md:gap-3">
    <div class="w-full md:w-2/5 p-2 md:p-4 flex flex-col">
        <img
        src="https://images.pexels.com/photos/3763115/pexels-photo-3763115.jpeg"
        [alt]="exercise?.name"
        class="w-full h-auto rounded-lg shadow-md"
      />
    </div>
    <div class="w-full md:w-3/5 p-2 md:p-0">
        <h1 class="text-lg md:text-xl font-bold mb-2">
            {{ exercise?.name }}
        </h1>

        <p class="text-gray-600 text-xs md:text-sm leading-relaxed">
            {{ exercise?.description }}
        </p>

        @if (exercise && accountService.hasPermission(permissions.Exercises.Delete)) {
            <button
                mat-stroked-button
                color="warn"
                class="mt-4"
                [disabled]="deleting"
                (click)="onDelete()">
                {{ deleting ? 'Deleting...' : 'Delete Exercise' }}
            </button>
        }
    </div>
</div>
