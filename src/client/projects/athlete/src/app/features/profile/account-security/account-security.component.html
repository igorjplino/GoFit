<mat-card class="p-4 md:p-6 bg-white">
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" #passwordFormDirective="ngForm">
        <div class="mb-6">
            <h2 class="text-xl md:text-2xl font-semibold">Account &amp; Security</h2>
            <p class="text-sm text-gray-500 mt-1">Change your password.</p>
        </div>

        <app-text-input
            label="Current Password"
            type="password"
            formControlName="currentPassword"
            [required]="true" />

        <app-text-input
            label="New Password"
            type="password"
            formControlName="newPassword"
            [required]="true"
            hint="At least 6 characters" />

        <app-text-input
            label="Confirm New Password"
            type="password"
            formControlName="confirmPassword"
            [required]="true" />

        @if (passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.dirty) {
            <div class="mb-3 text-sm text-red-600">Passwords do not match.</div>
        }

        @if (validationErrors) {
            <div class="mb-3 p-4 bg-red-100 text-red-600">
                <ul class="list-disc px-3">
                    @for (error of validationErrors; track $index) {
                        <li>{{error}}</li>
                    }
                </ul>
            </div>
        }

        <button
            mat-flat-button
            type="submit"
            [disabled]="passwordForm.invalid || submitting()"
            class="w-full md:w-auto px-6 py-2">
            {{ submitting() ? 'Saving...' : 'Change Password' }}
        </button>
    </form>
</mat-card>
