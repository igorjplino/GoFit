@if (loaded()) {
    <mat-card class="p-4 md:p-6 bg-white">
        <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
            <div class="mb-6">
                <h2 class="text-xl md:text-2xl font-semibold">Personal Information</h2>
                <p class="text-sm text-gray-500 mt-1">Update the name shown across GoFit.</p>
            </div>

            <app-text-input
                label="Name"
                formControlName="name"
                [required]="true"
                hint="Between 3 and 200 characters" />

            <div class="mb-6">
                <div class="text-xs uppercase text-gray-500">Email</div>
                <div class="text-base">{{ email() }}</div>
                <div class="text-xs text-gray-500 mt-1">Your email can't be changed here yet.</div>
            </div>

            @if (validationErrors) {
                <div class="mb-3 p-4 bg-red-100 text-red-600">
                    <ul class="list-disc px-3">
                        @for (error of validationErrors; track $index) {
                            <li>{{error}}</li>
                        }
                    </ul>
                </div>
            }

            <button
                mat-flat-button
                type="submit"
                [disabled]="profileForm.invalid || profileForm.pristine || submitting()"
                class="w-full md:w-auto px-6 py-2">
                {{ submitting() ? 'Saving...' : 'Save Changes' }}
            </button>
        </form>
    </mat-card>
}
