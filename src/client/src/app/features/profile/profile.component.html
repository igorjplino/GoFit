<div class="max-w-5xl mx-auto mt-6 md:mt-10 px-2 md:px-0">
    <div class="mb-6">
        <h1 class="text-2xl md:text-3xl font-semibold text-primary">Profile</h1>
        <p class="text-sm text-gray-500 mt-1">Manage your account details.</p>
    </div>

    <div class="flex flex-col md:flex-row gap-6">
        <nav class="w-full md:w-64 shrink-0 flex flex-col gap-1">
            @for (item of navItems; track item.label) {
                @if (item.route) {
                    <a
                        [routerLink]="item.route"
                        routerLinkActive="bg-gray-100 text-primary font-medium"
                        class="flex items-start gap-3 rounded-md px-3 py-2 hover:bg-gray-50">
                        <mat-icon class="shrink-0">{{item.icon}}</mat-icon>
                        <span class="flex flex-col leading-tight">
                            <span class="text-sm">{{item.label}}</span>
                            <span class="text-xs text-gray-500">{{item.description}}</span>
                        </span>
                    </a>
                }
                @else {
                    <div
                        aria-disabled="true"
                        class="flex items-start gap-3 rounded-md px-3 py-2 opacity-50 cursor-not-allowed">
                        <mat-icon class="shrink-0">{{item.icon}}</mat-icon>
                        <span class="flex flex-col leading-tight">
                            <span class="text-sm">{{item.label}}</span>
                            <span class="text-xs text-gray-500">Coming soon</span>
                        </span>
                    </div>
                }
            }
        </nav>

        <div class="flex-1 min-w-0">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
