@if (accountService.currentUser(); as user) {
    <div class="flex flex-col items-start gap-2 mt-6">
        <h1 class="text-2xl md:text-3xl font-semibold">Welcome back, {{ user.displayName }}!</h1>
        <p class="text-gray-500">This is your personal space. More features are coming soon.</p>
    </div>
} @else {
    <div class="flex flex-col items-start gap-4 mt-6">
        <h1 class="text-2xl md:text-3xl font-semibold">Welcome to GoFit</h1>
        <p class="text-gray-500">Log in or create an account to access your personal space.</p>
        <div class="flex gap-3">
            <button routerLink="/account/login" mat-stroked-button>Login</button>
            <button routerLink="/account/register" mat-stroked-button>Register</button>
        </div>
    </div>
}
